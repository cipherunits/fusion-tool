name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: fusion

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: fusion

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: fusion.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Linux / macOS
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p package

          cp target/${{ matrix.target }}/release/${{ matrix.binary }} package/

          tar -czf \
            fusion-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz \
            -C package \
            ${{ matrix.binary }}

      # Windows
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package

          Copy-Item `
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            "package/${{ matrix.binary }}"

          Compress-Archive `
            -Path "package/${{ matrix.binary }}" `
            -DestinationPath "fusion-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: fusion-${{ matrix.target }}
          path: |
            fusion-*.tar.gz
            fusion-*.zip

  release:
    name: Create GitHub Release

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.tar.gz
            release/**/*.zip
          generate_release_notes: true