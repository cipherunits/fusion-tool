name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # `fusion --version` reports the Cargo.toml version, so a tag that does not
  # match it would ship a binary reporting the wrong version.
  version:
    name: Check version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')"

          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}."
            echo "Bump the version in Cargo.toml before tagging."
            exit 1
          fi

          echo "OK: ${GITHUB_REF_NAME} matches Cargo.toml."

  build:
    name: Build ${{ matrix.target }}

    needs: version

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: fusion

          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: fusion

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: fusion.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # macOS runners are arm64, so the x86_64 binary cannot be executed here.
      - name: Smoke test binary
        if: matrix.os != 'macos-latest'
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} --version

      # A dynamic VCRUNTIME140.dll import makes the binary fail to start on a
      # Windows machine without the Visual C++ Redistributable.
      - name: Verify Windows binary is self-contained
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/${{ matrix.binary }}"

          $content = [Text.Encoding]::ASCII.GetString(
            [IO.File]::ReadAllBytes($exe)
          )

          if ($content -match "VCRUNTIME140\.dll") {
            Write-Error "$exe depends on VCRUNTIME140.dll; expected a static CRT."
            exit 1
          }

          Write-Host "OK: no Visual C++ Redistributable dependency."

      # Linux / macOS
      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p package

          cp \
            target/${{ matrix.target }}/release/${{ matrix.binary }} \
            package/${{ matrix.binary }}

          tar -czf \
            fusion-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz \
            -C package \
            ${{ matrix.binary }}

      # Windows
      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package

          Copy-Item `
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            "package/${{ matrix.binary }}"

          Compress-Archive `
            -Path "package/${{ matrix.binary }}" `
            -DestinationPath "fusion-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            fusion-*.tar.gz
            fusion-*.zip
          if-no-files-found: error

  release:
    name: Create Release

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true

      - name: List release files
        run: |
          echo "Release files:"
          find release -type f -maxdepth 2 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Fusion Framework ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip