[package]
name = "fusion-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fusion"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6.4", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"
